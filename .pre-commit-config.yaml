# Every check runs from python-sdlc, pinned here once (constitution XII,
# v1.30.0). This `rev:` fixes the launcher, the image and every tool inside it,
# for this laptop and for CI, which reads the same line.
#
# What each hook runs is configured in pyproject.toml: [tool.sdlc.commit],
# [tool.sdlc.push], [tool.sdlc.ci]. `sdlc tiers` prints it.
#
# `default_install_hook_types` must name both: without pre-push, `pre-commit
# install` wires only the commit hook and every verdict silently stops running.

default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/crunchtools/python-sdlc
    rev: v0.4.0
    hooks:
      - id: sdlc-commit
      - id: sdlc-push
