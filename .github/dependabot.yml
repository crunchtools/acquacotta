# Dependabot config for crunchtools Python projects using requirements.txt.
# See constitution.md Section XV.
#
# This repo declares dependencies as ranges in requirements.txt rather than
# resolving to a committed lockfile, so "pip" is the ecosystem that applies.
# Article XV's lockfile requirement is still outstanding here; wiring the
# update path first is strictly better than leaving the repo unwatched.

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
