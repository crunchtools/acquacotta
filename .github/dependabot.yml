# Dependabot config for crunchtools Python projects using pip-compile.
# See constitution.md Section XV.
#
# Dependency sources are the .in files; the .txt files are the generated,
# fully pinned lockfiles that the Containerfile and CI actually install:
#   - requirements.in      -> requirements.txt      (runtime, Containerfile)
#   - requirements-dev.in  -> requirements-dev.txt  (tests, .github/workflows/test.yml)
#
# Dependabot understands this pair and updates both sides together.
# Regenerate locally with:
#   uv pip compile requirements.in     -o requirements.txt     --python-version 3.11
#   uv pip compile requirements-dev.in -o requirements-dev.txt --python-version 3.11

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
