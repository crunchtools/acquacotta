# Canonical Dependabot config for crunchtools Python projects using uv.
# Drop in as .github/dependabot.yml. See constitution.md Section XV.
#
# Covers both ecosystems that go stale silently if left unpinned:
#   - uv:            uv.lock (must be committed, never gitignored)
#   - github-actions: `uses: some-action@vX.Y.Z` pins in .github/workflows/
#
# RT#1564: this replaces the old "pip" block that tracked requirements.in/
# requirements.txt and requirements-dev.in/requirements-dev.txt, which were a
# second dependency source alongside this same uv.lock. Those files are
# retired; pyproject.toml + uv.lock are now the single source, exported to a
# requirements-txt format inside each Containerfile's lock stage.

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "crunchtools/constitution*"
