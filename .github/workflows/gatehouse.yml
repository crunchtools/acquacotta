name: Gatehouse

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  guard:
    name: Protect workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Reject workflow changes from untrusted PRs
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          # Gate on where the branch lives, not on the author's role. What
          # pull_request_target actually guards against is a fork PR reaching
          # repo secrets; a branch pushed into this repo already required write
          # access. author_association got that backwards in both directions --
          # it trusts a COLLABORATOR pushing from their own fork, and it
          # distrusts Dependabot (author_association NONE) whose branches are
          # ours, which failed every action-bump PR this repo ever got.
          if [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
            echo "Head branch is in $GITHUB_REPOSITORY; allowing."; exit 0
          fi
          changed="$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)"
          if echo "$changed" | grep -qE '^\.github/workflows/'; then
            echo "::error::PR modifies .github/workflows/ — not accepted from external contributors."
            exit 1
          fi
          echo "No workflow files changed."

  # Advisory only — posts findings as PR comments and always passes.
  # Do NOT mark this job a required status check (see crunchtools constitution XII).
  review:
    name: Gatehouse review
    permissions:
      contents: read
      pull-requests: write
    uses: crunchtools/gatehouse/.github/workflows/review.yml@v0.9.0
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
