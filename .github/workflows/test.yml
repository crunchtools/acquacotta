name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sdlc:
    name: sdlc ci
    timeout-minutes: 30
    # Same-repo PRs run on our cached runner, pushes and schedules on the uncached
    # one; forks and Dependabot stay on GitHub's. An empty variable falls back to
    # ubuntu-latest (crunchtools/trentina security.yml).
    runs-on: >-
      ${{ github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]'
          && (vars.CACHED_RUNNER_LABEL || 'ubuntu-latest')
          || github.event_name != 'pull_request'
          && (vars.UNCACHED_RUNNER_LABEL || 'ubuntu-latest')
          || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # .sdlc/bin/sdlc asks the image for its own launcher, so the launcher, the
      # image and every tool float together. SDLC_IMAGE comes only from the
      # repository variable (latest when unset; main, X.Y.Z or @sha256:<digest>).
      - name: sdlc ci
        env:
          SDLC_IMAGE: ${{ vars.SDLC_IMAGE }}
        run: .sdlc/bin/sdlc ci

  gourmand-review:
    name: Code Quality (Gourmand)
    uses: crunchtools/gatehouse/.github/workflows/gourmand.yml@v0

  javascript-tests:
    name: JavaScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Run JavaScript tests
        run: |
          node << 'EOF'
          const puppeteer = require('puppeteer');
          const path = require('path');
          const fs = require('fs');

          (async () => {
            const browser = await puppeteer.launch({
              headless: 'new',
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            const page = await browser.newPage();

            // Enable console logging
            page.on('console', msg => console.log('Browser:', msg.text()));
            page.on('pageerror', err => console.error('Page error:', err.message));

            // Load the test page
            const testFile = path.resolve('tests/js/test_utils.html');
            console.log('Loading test file:', testFile);

            await page.goto('file://' + testFile, { waitUntil: 'networkidle0' });

            // Wait for tests to complete (check for data attribute)
            await page.waitForFunction(() => {
              return document.body.hasAttribute('data-test-exit-code');
            }, { timeout: 30000 });

            // Get results
            const results = await page.evaluate(() => ({
              exitCode: document.body.getAttribute('data-test-exit-code'),
              passed: document.body.getAttribute('data-test-passed'),
              failed: document.body.getAttribute('data-test-failed')
            }));

            console.log(`\nTest Results: ${results.passed} passed, ${results.failed} failed`);

            await browser.close();

            // Exit with appropriate code
            process.exit(parseInt(results.exitCode));
          })();
          EOF

      - name: Run index.html browser tests
        run: node tests/js/test_index.js

      - name: Run storage.js sync tests
        run: node tests/js/test_storage_sync.js
