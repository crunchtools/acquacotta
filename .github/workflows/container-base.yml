# Container release for acquacotta-base, the image the app builds FROM. A
# cascade image: :latest tracks :main, and every promotion dispatches
# parent-image-updated to acquacotta, whose own boot gate then tests the app on
# the new base before the app moves. ubi10-core dispatches here.

name: Container (base)

on:
  pull_request:
    paths: [Containerfile.base, pyproject.toml, uv.lock, static/acquacotta-http.conf, static/gunicorn.service]
  push:
    branches: [main]
    paths: [Containerfile.base, pyproject.toml, uv.lock, static/acquacotta-http.conf, static/gunicorn.service]
  repository_dispatch:
    types: [parent-image-updated]
  schedule:
    - cron: "29 6 * * 1"   # weekly: base-image errata, gated like any build
  workflow_dispatch:

permissions: {}

jobs:
  base:
    uses: crunchtools/constitution/.github/workflows/container-release.yml@c50e48f8a6502674a66c412977be3c9e69ca4a8c
    permissions:
      contents: read
      pull-requests: read
    with:
      image: quay.io/crunchtools/acquacotta-base
      containerfile: Containerfile.base
      # The base carries the runtime and the locked dependencies, not the app;
      # the app's boot gate is what proves a base works.
      boot: command
      boot-command: >-
        podman run --rm --entrypoint python3 "$IMAGE" -c
        "import flask, gunicorn, fastmcp, gspread, cryptography, requests; print('base imports ok')"
      cascade: true
      downstream: acquacotta
      constitution-ref: c50e48f8a6502674a66c412977be3c9e69ca4a8c
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
      CRUNCHTOOLS_CI_APP_KEY: ${{ secrets.CRUNCHTOOLS_CI_APP_KEY }}
