name: Build Base Container Images

on:
  push:
    branches: [main]
    paths:
      - 'Containerfile.base'
      - 'Containerfile.test'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'static/acquacotta-http.conf'
      - 'static/entrypoint.sh'
  repository_dispatch:
    types: [parent-image-updated]
  workflow_dispatch:

env:
  REGISTRY: quay.io
  BASE_IMAGE: crunchtools/acquacotta-base
  TEST_IMAGE: crunchtools/acquacotta-test
  GHCR_BASE_IMAGE: ghcr.io/crunchtools/acquacotta-base
  GHCR_TEST_IMAGE: ghcr.io/crunchtools/acquacotta-test

jobs:
  build-base:
    name: Build Base Image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile.base
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BASE_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.BASE_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Run Trivy vulnerability scanner
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.BASE_IMAGE }}:latest
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

  build-test:
    name: Build Test Image
    runs-on: ubuntu-latest
    needs: build-base
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push test image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile.test
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.TEST_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.TEST_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Run Trivy vulnerability scanner
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.TEST_IMAGE }}:latest
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

  build-base-ghcr:
    name: Build Base Image (GHCR)
    runs-on: ubuntu-latest
    needs: build-base
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Build and push base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile.base
          push: true
          tags: |
            ${{ env.GHCR_BASE_IMAGE }}:latest
            ${{ env.GHCR_BASE_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  build-test-ghcr:
    name: Build Test Image (GHCR)
    runs-on: ubuntu-latest
    needs: [build-test, build-base-ghcr]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Build and push test image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile.test
          push: true
          tags: |
            ${{ env.GHCR_TEST_IMAGE }}:latest
            ${{ env.GHCR_TEST_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
