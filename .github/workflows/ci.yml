# One file, every repo, copied unchanged. A job is a trust level; `sdlc event`
# routes inside it. The only version here is the bootstrap's digest: it resolves
# quay.io/crunchtools/sdlc:<major>, verifies it against sdlc's own key and a
# minimum version, and runs it on the runner's own podman (no `container:`, no
# Docker): the same engine on GitHub's runners and ours. One image build per
# release; a pull request test-builds only when a Containerfile or lockfile changes. Every
# secret is an org secret: a fork's PR gets none, pull_request_target runs the
# default branch's copy of this file, and only Prime's credential may change a
# workflow. Every job that holds one runs on our uncached runners, or GitHub's
# for a fork. The Claude token never reaches a model reading a fork's PR or an
# outsider's issue: ai gets it only for this repo's own PRs and members' issues.
name: CI
on:
  push:
  pull_request:
  pull_request_target: { types: [opened, synchronize, reopened] }  # zizmor: ignore[dangerous-triggers]
  pull_request_review_comment: { types: [created, edited, deleted] }
  issues: { types: [opened, labeled, reopened] }
  schedule: [{ cron: "17 6 * * 1" }, { cron: "47 */6 * * *" }]  # weekly: audit, rebuild, keepalive; 6-hourly: parent image moved?
  workflow_dispatch: { inputs: { version: { type: string } } }
permissions: {}
jobs:
  check:  # no secret, read token: the one level a fork's PR runs; our uncached runners otherwise
    name: sdlc / check (${{ github.event_name }})  # required as "(pull_request)"
    if: >-
      contains(fromJSON('["pull_request","schedule"]'), github.event_name)
      || contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.UNCACHED_RUNNER_LABEL || 'ubuntu-latest' }}
    permissions: { contents: read, security-events: write, actions: write }  # actions: the 60-day schedule keepalive
    outputs: { result: "${{ steps.e.outputs.result }}" }
    env: { GITHUB_TOKEN: "${{ github.token }}" }
    steps: &event
      - id: e
        run: >-
          sudo systemctl start podman.socket && sudo chmod 0711 /run/podman && sudo chown "$(id -u)" /run/podman/podman.sock &&
          podman --remote --url unix:///run/podman/podman.sock run --rm --user 0 --security-opt label=disable
          -v /run/podman/podman.sock:/var/run/docker.sock
          -v "${RUNNER_WORKSPACE%/*}:${RUNNER_WORKSPACE%/*}" -w "$GITHUB_WORKSPACE"
          --env 'GITHUB_*' --env 'RUNNER_*' --env 'ACTIONS_*' --env CI --env 'SDLC_*' --env VERSION --env DIGEST
          --env 'QUAY_*' --env 'RHSM_*' --env 'REGISTRY_REDHAT_IO_*' --env 'COSIGN_*' --env 'ASHIGARU_*'
          --env 'RENOVATE_*' --env CLAUDE_CODE_OAUTH_TOKEN --env OPENROUTER_API_KEY
          quay.io/crunchtools/sdlc-bootstrap@sha256:abf7da909c14ae7b32d0a325fce912ec1a955d7bf4032365015b0ec46d9b3296 event
  ai:  # model keys and a read token, never an App key; hands its result on in four chunks of at most 112,500 bytes
    if: github.event_name == 'issues' || github.event_name == 'pull_request_target'
    runs-on: &secret ${{ (github.event_name == 'issues' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) || github.event_name != 'issues' && (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository)) && vars.UNCACHED_RUNNER_LABEL == 'crunchtools-uncached' && 'crunchtools-uncached' || 'ubuntu-latest' }}
    permissions: { contents: read, issues: read, pull-requests: read }
    outputs: { p0: "${{ steps.e.outputs.p0 }}", p1: "${{ steps.e.outputs.p1 }}", p2: "${{ steps.e.outputs.p2 }}", p3: "${{ steps.e.outputs.p3 }}" }
    env: { GITHUB_TOKEN: "${{ github.token }}", CLAUDE_CODE_OAUTH_TOKEN: "${{ (github.event_name == 'issues' && contains(fromJSON('[\"OWNER\",\"MEMBER\",\"COLLABORATOR\"]'), github.event.issue.author_association) || github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository) && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}", OPENROUTER_API_KEY: "${{ secrets.OPENROUTER_API_KEY }}" }
    steps: *event
  image:  # one build per release: verifies the parent itself, builds FROM @digest through the socket, gates, pushes gated-<sha>
    name: sdlc / image (${{ github.event_name }})
    needs: check
    if: >-
      needs.check.result == 'success' && github.event_name != 'pull_request' && fromJSON(needs.check.outputs.result || '{}').image
    runs-on: *secret
    permissions: { contents: read }
    outputs: { result: "${{ steps.e.outputs.result }}" }
    env: { GITHUB_TOKEN: "${{ github.token }}", QUAY_USERNAME: "${{ secrets.QUAY_USERNAME }}", QUAY_PASSWORD: "${{ secrets.QUAY_PASSWORD }}",
           RHSM_ACTIVATION_KEY: "${{ secrets.RHSM_ACTIVATION_KEY }}", RHSM_ORG_ID: "${{ secrets.RHSM_ORG_ID }}",
           REGISTRY_REDHAT_IO_USER: "${{ secrets.REGISTRY_REDHAT_IO_USER }}", REGISTRY_REDHAT_IO_PASSWORD: "${{ secrets.REGISTRY_REDHAT_IO_PASSWORD }}" }
    steps: *event
  write:  # the Ashigaru App key, no model: verifies and tags a release merge once image and boot pass; comments, labels, PRs, leased pushes
    needs: [check, ai, image, boot]
    if: >-
      always() && !cancelled() && !inputs.digest
      && (github.event_name == 'pull_request_target' || github.event_name == 'issues'
          || needs.check.result == 'success' && (github.event_name == 'workflow_dispatch' || fromJSON(needs.check.outputs.result || '{}').write)
             && (!fromJSON(needs.check.outputs.result || '{}').release
                 || (needs.image.result == 'success' || needs.image.result == 'skipped' && !fromJSON(needs.check.outputs.result || '{}').image)
                    && (needs.boot.result == 'success' || needs.boot.result == 'skipped' && !fromJSON(needs.check.outputs.result || '{}').boot)))
    concurrency: { group: "write-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}", queue: max }
    runs-on: *secret
    permissions: {}
    outputs: { release: "${{ steps.e.outputs.release }}" }
    env: { ASHIGARU_CLIENT_ID: "${{ vars.ASHIGARU_CLIENT_ID }}", ASHIGARU_APP_KEY: "${{ secrets.ASHIGARU_APP_KEY }}", VERSION: "${{ inputs.version }}", DIGEST: "${{ inputs.digest }}", SDLC_CHECK: "${{ needs.check.outputs.result }}",
           SDLC_IMAGE: "${{ needs.image.result }}", SDLC_BOOT: "${{ needs.boot.result }}",
           SDLC_AI: "${{ needs.ai.result }}", SDLC_AI_0: "${{ needs.ai.outputs.p0 }}", SDLC_AI_1: "${{ needs.ai.outputs.p1 }}", SDLC_AI_2: "${{ needs.ai.outputs.p2 }}", SDLC_AI_3: "${{ needs.ai.outputs.p3 }}" }
    steps: *event
  boot:  # no secret, a read token: a repo's boot-command and contract-test, shell run on the digest image pushed; promote needs it
    name: sdlc / boot (${{ github.event_name }})
    needs: [check, image]
    if: needs.check.result == 'success' && needs.image.result == 'success' && fromJSON(needs.check.outputs.result || '{}').boot
    runs-on: *secret  # the socket is the credential: crunchtools-uncached, one job per VM, or GitHub's
    permissions: { contents: read }
    env: { GITHUB_TOKEN: "${{ github.token }}", SDLC_IMAGE_RESULT: "${{ needs.image.outputs.result }}" }
    steps: *event
  promote:  # the cosign key: signs, attests and moves tags on a digest it did not build; idempotent; version only from write
    needs: [check, image, boot, write]
    if: >-
      always() && !cancelled() && needs.image.result == 'success' && github.event_name != 'pull_request'
      && (needs.boot.result == 'success' || needs.boot.result == 'skipped' && !fromJSON(needs.check.outputs.result || '{}').boot)
    concurrency: { group: "promote-${{ github.repository }}", queue: max }
    runs-on: *secret
    permissions: { contents: read }
    env: { GITHUB_TOKEN: "${{ github.token }}", SDLC_CHECK: "${{ needs.check.outputs.result }}", SDLC_IMAGE_RESULT: "${{ needs.image.outputs.result }}", SDLC_BOOT: "${{ needs.boot.result }}", SDLC_WRITE: "${{ needs.write.result }}", SDLC_RELEASE: "${{ needs.write.outputs.release }}",
           QUAY_USERNAME: "${{ secrets.QUAY_USERNAME }}", QUAY_PASSWORD: "${{ secrets.QUAY_PASSWORD }}", COSIGN_PRIVATE_KEY: "${{ secrets.COSIGN_PRIVATE_KEY }}", COSIGN_PASSWORD: "${{ secrets.COSIGN_PASSWORD }}" }
    steps: *event
  pypi:  # OIDC only; re-derives the release from the API itself and must agree with write
    needs: [check, write]
    if: always() && !cancelled() && needs.check.result == 'success' && github.event_name == 'push' && fromJSON(needs.check.outputs.result || '{}').release.publish == 'pypi'
    runs-on: *secret
    environment: pypi
    permissions: { contents: read, id-token: write }
    env: { GITHUB_TOKEN: "${{ github.token }}", SDLC_WRITE: "${{ needs.write.result }}", SDLC_RELEASE: "${{ needs.write.outputs.release }}" }
    steps: *event
  assets:  # GITHUB_TOKEN with contents: write, no stored secret: builds a release's digest-pinned package stages, attaches their files to the Release write made
    needs: [check, write]
    if: >-
      always() && !cancelled() && needs.check.result == 'success' && github.event_name == 'push'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && fromJSON(needs.check.outputs.result || '{}').assets
    concurrency: { group: "assets-${{ github.repository }}", queue: max }
    runs-on: *secret
    permissions: { contents: write }
    env: { GITHUB_TOKEN: "${{ github.token }}", SDLC_WRITE: "${{ needs.write.result }}", SDLC_RELEASE: "${{ needs.write.outputs.release }}" }
    steps: *event
  pages:  # the package site's GPG key, held only in pages-signing (default branch only); signs other repos' release assets as data, pushes gh-pages
    needs: check
    if: >-
      needs.check.result == 'success' && fromJSON(needs.check.outputs.result || '{}').pages
      && (github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    concurrency: { group: "pages-${{ github.repository }}", queue: max }
    runs-on: *secret
    environment: ${{ fromJSON(needs.check.outputs.result || '{}').pages && 'pages-signing' || '' }}  # an expression: a bare name makes GitHub refuse the whole file in repos without it
    permissions: { contents: write, pages: write }
    env: { GITHUB_TOKEN: "${{ github.token }}", SDLC_PAGES_GPG_KEY: "${{ secrets.PACKAGES_GPG_KEY }}" }
    steps: *event
  gate:  # required: guard, review done on this head, every finding answered; no secret. A collaborator's reply re-runs it where it counts
    name: sdlc / gate (${{ github.event_name }})  # required as "(pull_request_target)"
    needs: [ai, write]
    if: >-
      always() && (github.event_name == 'pull_request_target'
      || github.event_name == 'pull_request_review_comment' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    concurrency: { group: "gate-${{ github.event.pull_request.number }}-${{ github.event_name }}" }
    runs-on: ${{ vars.UNCACHED_RUNNER_LABEL == 'crunchtools-uncached' && 'crunchtools-uncached' || 'ubuntu-latest' }}  # no repo code runs here, a fork's PR included
    permissions: { contents: read, pull-requests: write, actions: write }
    env: { GITHUB_TOKEN: "${{ github.token }}", SDLC_AI: "${{ needs.ai.result }}", SDLC_WRITE: "${{ needs.write.result }}" }
    steps: *event
  renovate:  # the Renovate App key alone, no GITHUB_TOKEN; the constitution only: the weekly run for real, a bare dispatch dry
    if: >-
      github.repository == 'crunchtools/constitution'
      && (github.event.schedule == '17 6 * * 1'
          || github.event_name == 'workflow_dispatch' && !inputs.version && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    concurrency: { group: renovate, queue: max }
    timeout-minutes: 55  # the minted token lives an hour
    runs-on: *secret
    environment: renovate
    permissions: {}
    env: { RENOVATE_APP_KEY: "${{ secrets.RENOVATE_APP_KEY }}" }
    steps: *event
