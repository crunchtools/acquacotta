[project]
name = "acquacotta"
version = "2.38.0"
description = "Pomodoro time tracking web application"
requires-python = ">=3.10"

dependencies = [
  "flask>=3.0",
  "google-auth>=2.0",
  "google-auth-oauthlib>=1.0",
  "google-api-python-client>=2.0",
  "gspread>=6.0",
  "gunicorn>=21.0",
  "fastmcp>=4.0.4,<5",
  "cryptography>=42.0",
  "requests>=2.31",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app", "sheets_storage"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
fail_under = 50

[tool.ruff]
target-version = "py310"
line-length = 120
# Spec documents are prose, not source. ruff 0.16 began formatting fenced code
# blocks inside Markdown, which rewrites illustrative snippets in specs to look
# like real code. Same exclusions gourmand.toml uses.
exclude = ["specs", ".specify"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "C901",   # McCabe complexity
    "PLR",    # Pylint refactor rules
]
ignore = [
    "E501",   # line too long: ruff-format can't wrap long string literals (e.g. a Drive query filter in json_google_drive_storage.py)
]

[tool.ruff.lint.pylint]
max-branches = 10
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]  # Magic values acceptable in test assertions
"app.py" = ["PLR0915", "PLR0911"]  # auth_callback / token-mint routes are guard-clause heavy by nature
# MCP tool + storage functions expose many named parameters that agents pass by
# name; bundling them into an object would obscure the tool schema, so PLR0913
# and PLR0917 are accepted here (PLR0917 left preview in ruff 0.16 and started
# firing on these same signatures). register_mcp_tools is a flat list of
# @mcp.tool definitions.
"todos_plugin.py" = ["PLR0915", "C901", "PLR0913", "PLR0917"]
"discussions_plugin.py" = ["PLR0915", "C901", "PLR0913", "PLR0917"]
"rt_plugin.py" = ["PLR0915", "C901", "PLR0913", "PLR0917"]
"pomodoro_tools.py" = ["PLR0913", "PLR0917"]

[tool.ruff.lint.isort]
known-first-party = ["app", "sheets_storage"]

# RT#1564: requirements.in/requirements.txt (and the Dependabot pip block that
# maintained them) are retired. pyproject.toml + uv.lock are now the single
# dependency source; Containerfile and Containerfile.base export uv.lock via a
# lock stage (`uv export --frozen --no-dev ...`) instead of installing a
# separately-compiled requirements.txt.
[dependency-groups]
dev = [
  "mypy>=1.14",
  "pytest>=8.0",
  "pytest-cov>=4.0",
  "pytest-flask>=1.3",
  # Added by RT#1564 so Containerfile.test's `ruff check`/`ruff format --check`
  # and pre-commit hooks resolve from uv.lock too -- requirements-dev.in had
  # these but pyproject's dev group didn't, which is exactly the kind of silent
  # gap the single-source fix exists to close. Same floor requirements-dev.in
  # used (ruff>=0.4); `uv lock` kept it at the already-locked 0.16.8, which
  # `ruff check .`/`ruff format --check .` pass against -- once Containerfile.
  # test copies the full module set (see that file: a separate, pre-existing
  # gap found while verifying this change -- with only app.py/sheets_storage.py
  # present, ruff's first-party import detection misclassified the rest as
  # third-party and both pytest and ruff broke).
  "ruff>=0.4",
  "pre-commit>=3.0",
]

# Flat modules at the root plus transports/ -- not a package, so by path.
[tool.mypy]
files = ["transports", "tests"]
ignore_missing_imports = true

[tool.sdlc.push]
# No in-repo Semgrep rules: the check exits 2 when .semgrep is absent rather
# than scanning nothing and calling it a pass.
skip = ["semgrep"]

[tool.sdlc]
repo-kinds = ["web-application"]

[tool.sdlc.image]
image = "quay.io/crunchtools/acquacotta"
# The published digest boots under systemd with both units up. The full gate
# (/ answers 200, gunicorn never restarted) is `app-boot` below.
boot = "systemd"
boot-units = "gunicorn httpd"
boot-env = """
FLASK_SECRET_KEY=gate-only
FLASK_HOST=127.0.0.1
"""

# The image the app builds FROM: runtime and locked dependencies, no app. The
# app is built FROM the digest this run pushes and booted, which is what proves
# a base works; the weekly and parent-poll rebuilds cascade to the app.
[[tool.sdlc.images]]
name = "acquacotta-base"
containerfile = "Containerfile.base"
boot = "none"
boot-none-reason = "carries no app; the acquacotta image built FROM this digest in the same run is the boot gate"

[tool.sdlc.ci]
checks = ["js-tests", "app-image", "app-boot"]

[tool.sdlc.ci.js-tests]
# Replaces the test.yml JavaScript job (npm install puppeteer + inline node).
# The pinned puppeteer image carries node, puppeteer and its Chrome.
kind = "command"
image = "ghcr.io/puppeteer/puppeteer:25.15.0@sha256:6fe165bf38791ad7bec3a276e29c2e167dd0a9b1c02bb4c8e8ac269bdf274b03"
argv = ["node", "--test", "tests/js/run_utils.js", "tests/js/test_index.js", "tests/js/test_storage_sync.js"]
env = { NODE_PATH = "/home/pptruser/node_modules", PUPPETEER_CACHE_DIR = "/home/pptruser/.cache/puppeteer" }

[tool.sdlc.ci.app-image]
kind = "image-build"

# The boot gate container-release ran (tests/image/boot-check.sh): systemd as
# PID 1, as production runs it. Ready once boot reaches multi-user.target,
# degraded or not; the script judges the units.
[tool.sdlc.ci.app-boot]
kind = "command"
systemd = true
image = "localhost/acquacotta:sdlc"
ready = ["systemctl", "is-active", "multi-user.target"]
argv = ["bash", "tests/image/boot-check.sh"]
