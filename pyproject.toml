[project]
name = "acquacotta"
version = "2.34.0"
description = "Pomodoro time tracking web application"
requires-python = ">=3.10"

dependencies = [
  "flask>=3.0",
  "google-auth>=2.0",
  "google-auth-oauthlib>=1.0",
  "google-api-python-client>=2.0",
  "gspread>=6.0",
  "gunicorn>=21.0",
  "fastmcp>=4.0.4,<5",
  "cryptography>=42.0",
  "requests>=2.31",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app", "sheets_storage"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
fail_under = 50

[tool.ruff]
target-version = "py310"
line-length = 120
# Spec documents are prose, not source. ruff 0.16 began formatting fenced code
# blocks inside Markdown, which rewrites illustrative snippets in specs to look
# like real code. Same exclusions gourmand.toml uses.
exclude = ["specs", ".specify"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "C901",   # McCabe complexity
    "PLR",    # Pylint refactor rules
]
ignore = [
    "E501",   # line too long: ruff-format can't wrap long string literals (e.g. a Drive query filter in json_google_drive_storage.py)
]

[tool.ruff.lint.pylint]
max-branches = 10
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]  # Magic values acceptable in test assertions
"app.py" = ["PLR0915", "PLR0911"]  # auth_callback / token-mint routes are guard-clause heavy by nature
# MCP tool + storage functions expose many named parameters that agents pass by
# name; bundling them into an object would obscure the tool schema, so PLR0913
# and PLR0917 are accepted here (PLR0917 left preview in ruff 0.16 and started
# firing on these same signatures). register_mcp_tools is a flat list of
# @mcp.tool definitions.
"todos_plugin.py" = ["PLR0915", "C901", "PLR0913", "PLR0917"]
"discussions_plugin.py" = ["PLR0915", "C901", "PLR0913", "PLR0917"]
"rt_plugin.py" = ["PLR0915", "C901", "PLR0913", "PLR0917"]
"pomodoro_tools.py" = ["PLR0913", "PLR0917"]

[tool.ruff.lint.isort]
known-first-party = ["app", "sheets_storage"]

# WHY THE DEPENDENCIES ARE WRITTEN TWICE, and what to do about it.
#
# This repo's dependencies have always lived in requirements.in, compiled by
# `uv pip compile` into requirements.txt, which all three Containerfiles
# pip-install. The gate reads pyproject.toml and uv.lock instead, so the direct
# dependencies above are a second copy of requirements.in.
#
# They are a copy on purpose. Making pyproject the single source would mean
# regenerating requirements.txt from uv.lock, and `uv export` does not
# necessarily resolve to the versions `uv pip compile` already pinned -- which
# would change what a DEPLOYED service installs, inside a pull request whose
# subject is CI wiring. Not that.
#
# The cost is real and worth naming: the gate can test versions the image does
# not ship. Collapsing the two to one source, and the Containerfiles with them,
# is tracked separately. Until then these two lists move together.
[dependency-groups]
dev = [
  "mypy>=1.14",
  "pytest>=8.0",
  "pytest-cov>=4.0",
  "pytest-flask>=1.3",
]

# Flat modules at the root plus transports/ -- not a package, so by path.
[tool.mypy]
files = ["transports", "tests"]
ignore_missing_imports = true

[tool.sdlc.push]
# No in-repo Semgrep rules: the check exits 2 when .semgrep is absent rather
# than scanning nothing and calling it a pass.
skip = ["semgrep"]
