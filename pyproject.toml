[project]
name = "acquacotta"
version = "2.2.5"
description = "Pomodoro time tracking web application"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app", "sheets_storage"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
fail_under = 50

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "C901",   # McCabe complexity
    "PLR",    # Pylint refactor rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B904",   # allow raise without from in except
]

[tool.ruff.lint.pylint]
max-branches = 10
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]  # Magic values acceptable in test assertions
"app.py" = ["PLR0915", "PLR0911"]  # auth_callback / token-mint routes are guard-clause heavy by nature
# MCP tool + storage functions expose many named parameters that agents pass by
# name; bundling them into an object would obscure the tool schema, so PLR0913 is
# accepted here. register_mcp_tools is a flat list of @mcp.tool definitions.
"todos_plugin.py" = ["PLR0915", "C901", "PLR0913"]
"pomodoro_tools.py" = ["PLR0913"]

[tool.ruff.lint.isort]
known-first-party = ["app", "sheets_storage"]
