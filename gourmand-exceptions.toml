[[exceptions]]
check = "copy_paste_detection"
path = "app.py"
justification = "api_mcp_status/api_mcp_disable and save_location/set_user_backend are pairs of route handlers that read or write different keys through the same three-line auth-and-lookup preamble. get_credentials matches _google_service on the same preamble."
classification = "by_design"

[[exceptions]]
check = "copy_paste_detection"
path = "json_pcloud_storage.py"
justification = "Every storage backend implements the same get/put interface over a different transport. The similarity between backends is the interface, and the point of having them."
classification = "by_design"

[[exceptions]]
check = "copy_paste_detection"
path = "json_google_drive_storage.py"
justification = "Every storage backend implements the same get/put interface over a different transport. The similarity between backends is the interface, and the point of having them."
classification = "by_design"

[[exceptions]]
check = "copy_paste_detection"
path = "sheets_storage.py"
justification = "count_pomodoros/clear_pomodoros and get_pomodoros/get_settings each open the same sheet range and then do different things with it. Sharing the range lookup is the similarity being flagged."
classification = "by_design"

[[exceptions]]
check = "copy_paste_detection"
path = "todos_plugin.py"
justification = "add_list and rename_list both load the list file, change one field and write it back. The load-modify-store shape is shared; the modification is not."
classification = "by_design"

[[exceptions]]
check = "security_practices"
path = "tests/js/test_utils.js"
justification = "Test-runner display harness only, never served to real users. All dynamic content (suite name, test name, error text) is passed through escapeHtml() before being concatenated into the HTML string; the flagged innerHTML assignments apply the already-sanitized result plus static markup and numeric counts."
classification = "by_design"

[[exceptions]]
check = "manifest_lint_suppression"
path = "pyproject.toml"
justification = "Every ruff ignore and per-file-ignore entry carries an inline comment naming the specific reason: E501 is redundant with the formatter, B008/B904 are deliberate Flask/MCP-decorator style choices, PLR2004 in tests/* covers magic-value assertions, and the PLR0911/PLR0915/PLR0913/PLR0917 entries on app.py, todos_plugin.py and pomodoro_tools.py are documented as guard-clause-heavy auth routes and MCP tool signatures that need many named parameters for the tool schema. These are deliberate configuration, not suppressions parked to be cleaned up later."
classification = "by_design"

[[exceptions]]
check = "copy_paste_detection"
path = "mcp_server.py"
justification = "main() (start the MCP server on MCP_HOST/MCP_PORT) and GoogleDriveTransport.upload_file (create-or-update a Drive file) are semantically unrelated; the 100% match is a coincidental structural collision between two short (3-statement) functions that happen to share a get-value/get-value-with-default/single-call shape. The check's logic has no way to distinguish this from real copy-paste."
classification = "gourmand_bug"

[[exceptions]]
check = "redundant_error_handling"
path = "static/js/storage.js"
justification = "loadCredentials (falls through to return null on failure — the caller already treats null as \"not logged in\"), auto-provision inside checkAuthStatus (leaves `provisioned` false so the caller's existing not-provisioned branch runs), and the bidirectional-sync-on-init / todo-sync-to-cloud handlers (each has a finally block that resets its in-progress flag so the next call can retry) all have real recovery behavior beyond the catch body itself. The check only inspects the catch block in isolation and can't see the surrounding return/conditional/finally that provides the actual handling."
classification = "by_design"

[[exceptions]]
check = "hidden_env_config"
path = "app.py"
justification = "All flagged vars are documented for operators: FLASK_SECRET_KEY, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET and FLASK_HOST in README.md's Environment Variables table and acquacotta.env.example; FLASK_ENV, SESSION_COOKIE_SECURE and OAUTH_REDIRECT_BASE in CLAUDE.md's Environment Variables (.env) section (SESSION_COOKIE_SECURE is additionally explained inline at its call site); PCLOUD_CLIENT_ID/PCLOUD_CLIENT_SECRET in CLAUDE.md's pCloud-optional block and acquacotta.env.example."
classification = "by_design"

[[exceptions]]
check = "hidden_env_config"
path = "mcp_server.py"
justification = "GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET are documented in README.md and acquacotta.env.example; MCP_HOST/MCP_PORT are documented in README.md's MCP-specific Environment Variables row (including the network/TLS-proxy caveat for MCP_HOST)."
classification = "by_design"

[[exceptions]]
check = "hidden_env_config"
path = "mcp_tokens.py"
justification = "MCP_TOKEN_SEAL_KEY is documented in acquacotta.env.example, including the fallback-to-FLASK_SECRET_KEY behavior and the production requirement to set it explicitly. FLASK_ENV and FLASK_SECRET_KEY are documented in README.md/CLAUDE.md as above."
classification = "by_design"
