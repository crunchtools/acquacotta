Listen 443 https
SSLPassPhraseDialog exec:/usr/libexec/httpd-ssl-pass-dialog
SSLSessionCache shmcb:/run/httpd/sslcache(512000)
SSLSessionCacheTimeout 300
<VirtualHost *:443>
    ServerName acquacotta.crunchtools.com
    SSLEngine on
    SSLCertificateFile /etc/pki/tls/certs/origin.crt
    SSLCertificateKeyFile /etc/pki/tls/private/origin.key
    ProxyPreserveHost On
    # Social drafting waits on a page fetch plus Gemini; match gunicorn's 90s.
    ProxyTimeout 90
    # Log the path only: shared links (/share, ?share=) and OAuth location ids ride
    # in query strings, and the Referer would repeat them. No user data in logs.
    LogFormat "%h %l %u %t \"%m %U %H\" %>s %b" acquacotta_path
    CustomLog "logs/access_log" acquacotta_path
    ProxyPass / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "acquacotta.crunchtools.com:8443"
    RequestHeader set X-Forwarded-Port "8443"
</VirtualHost>
