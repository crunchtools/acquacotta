<VirtualHost *:80>
    ServerName acquacotta.crunchtools.com
    ProxyPreserveHost On

    # MCP endpoint → FastMCP (Streamable HTTP) on 5001. Must precede the "/" rule.
    ProxyPass /mcp http://127.0.0.1:5001/mcp
    ProxyPassReverse /mcp http://127.0.0.1:5001/mcp

    # Everything else → Flask/Gunicorn on 5000.
    ProxyPass / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "acquacotta.crunchtools.com"
    RequestHeader set X-Forwarded-Port "443"
</VirtualHost>
